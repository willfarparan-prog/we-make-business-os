name: Verify
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build-time placeholders only. Tests use an in-memory Postgres; nothing reaches production.
      NEON_AUTH_BASE_URL: https://example.invalid/auth
      NEON_AUTH_COOKIE_SECRET: ci-build-only-not-a-production-secret-123456789
      WM_OWNER_EMAIL: ci@example.invalid
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
